<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Opérations · Livraisons à domicile - ClemenTino</title>

    <!-- ===== Dépendances (déjà présentes dans le layout Symfony existant) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- ===== Charte commune (module Commercial) + Opérations ===== -->
    <link rel="stylesheet" href="../commercial/assets/cx.css">
    <link rel="stylesheet" href="assets/ops.css">
</head>
<body class="cx-app" data-module="operations" data-page="o-livraisons">

<div id="cx-header"></div>
<div id="cx-subnav"></div>

<main class="cx-main">
    <div class="cx-page-head">
        <div>
            <div class="cx-crumb">Opérations · Flux des colis</div>
            <h1 class="cx-title">Livraisons à domicile</h1>
        </div>
        <div class="cx-page-actions">
            <div id="ox-agence-slot"></div>
            <button type="button" class="cx-btn cx-btn-ghost" id="btn-refresh"><i class="fa fa-refresh"></i> Rafraîchir</button>
        </div>
    </div>

    <div class="cx-kpis" id="kpis"></div>

    <div class="cx-card">
        <div class="cx-tabs" id="onglets" role="tablist">
            <a data-tab="alivrer" class="active" role="tab"><i class="fa fa-map-marker"></i> À livrer <span class="cx-count" id="n-alivrer">0</span></a>
            <a data-tab="tournees" role="tab"><i class="fa fa-motorcycle"></i> Tournées en cours <span class="cx-count" id="n-tournees">0</span></a>
            <a data-tab="cloturees" role="tab">Tournées clôturées <span class="cx-count" id="n-cloturees">0</span></a>
            <a data-tab="livreurs" role="tab"><i class="fa fa-users"></i> Livreurs <span class="cx-count" id="n-livreurs">0</span></a>
        </div>

        <!-- À livrer : constitution des tournées -->
        <div class="cx-card-body" id="vue-alivrer">
            <div class="cx-layout">
                <div>
                    <div class="cx-toolbar" style="padding:0 0 12px">
                        <div class="cx-field">
                            <label class="cx-label" for="f-zone">Zone</label>
                            <select class="form-control" id="f-zone"><option value="">Toutes</option></select>
                        </div>
                        <div class="cx-field cx-grow">
                            <label class="cx-label" for="q">Recherche</label>
                            <div class="cx-search"><i class="fa fa-search"></i><input type="search" class="form-control" id="q" placeholder="N° LT, destinataire, quartier, téléphone…"></div>
                        </div>
                    </div>
                    <div class="ox-groupes" id="zones"></div>
                </div>
                <aside class="cx-aside">
                    <div class="cx-block">
                        <div class="cx-block-title">Nouvelle tournée</div>
                        <p class="cx-muted" id="t-sel" style="margin-top:0">Aucun colis sélectionné</p>
                        <div class="cx-field">
                            <label class="cx-label req" for="t-livreur">Livreur</label>
                            <select class="form-control" id="t-livreur"></select>
                        </div>
                        <div class="cx-field">
                            <label class="cx-label" for="t-heure">Départ de la tournée</label>
                            <input type="time" class="form-control" id="t-heure" value="09:00">
                        </div>
                        <button type="button" class="cx-btn cx-btn-primary cx-btn-block" id="btn-tournee" disabled><i class="fa fa-motorcycle"></i> Constituer la tournée</button>
                        <button type="button" class="cx-btn cx-btn-link cx-btn-sm" id="btn-vider"><i class="fa fa-times"></i> Vider la sélection</button>
                    </div>
                </aside>
            </div>
        </div>

        <!-- Tournées -->
        <div class="cx-card-body cx-hidden" id="vue-tournees"><div class="ox-cards" id="tournees"></div></div>
        <div class="cx-hidden" id="vue-cloturees"><div id="dt-cloturees"></div></div>

        <!-- Livreurs -->
        <div class="cx-hidden" id="vue-livreurs">
            <div class="cx-card-body" style="padding-bottom:0">
                <button type="button" class="cx-btn cx-btn-new cx-btn-sm" id="btn-livreur"><i class="fa fa-plus"></i> Nouveau livreur</button>
            </div>
            <div id="dt-livreurs"></div>
        </div>
    </div>

    <!-- Zone d'impression (feuille de route) -->
    <div id="ox-print"></div>

    <p class="cx-demo-bar">Maquette - données de démonstration stockées dans le navigateur</p>
</main>

<div id="cx-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="../commercial/assets/cx-core.js"></script>
<script src="../commercial/assets/cx-data.js"></script>
<script src="../commercial/assets/cx-tarifs.js"></script>
<script src="../commercial/assets/cx-demo-exploitation.js"></script>
<script src="../commercial/assets/cx-pdf.js"></script>
<script src="../guichet/assets/guichet-commun.js"></script>
<script src="assets/ops-commun.js"></script>
<script>window.CX_BASE = "../commercial/";</script>
<script src="../commercial/assets/cx-shell.js"></script>
<script src="assets/pages/livraisons.js"></script>
</body>
</html>
