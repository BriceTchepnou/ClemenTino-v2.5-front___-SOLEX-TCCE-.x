<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Opérations · Colis en agence (en instance) - ClemenTino</title>

    <!-- ===== Dépendances (déjà présentes dans le layout Symfony existant) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- ===== Charte commune (module Commercial) + Opérations ===== -->
    <link rel="stylesheet" href="../commercial/assets/cx.css">
    <link rel="stylesheet" href="assets/ops.css">
</head>
<body class="cx-app" data-module="operations" data-page="o-instance">

<div id="cx-header"></div>
<div id="cx-subnav"></div>

<main class="cx-main">
    <div class="cx-page-head">
        <div>
            <div class="cx-crumb">Opérations · Flux des colis</div>
            <h1 class="cx-title">Colis en agence <small>en instance de retrait</small></h1>
        </div>
        <div class="cx-page-actions">
            <div id="ox-agence-slot"></div>
            <button type="button" class="cx-btn cx-btn-ghost" id="btn-refresh"><i class="fa fa-refresh"></i> Rafraîchir</button>
        </div>
    </div>

    <!-- Retrait rapide : le destinataire présente son n° de LT -->
    <div class="ox-scan">
        <i class="fa fa-barcode"></i>
        <div><b>Retrait au comptoir</b><small>Scannez le n° de LT présenté par le client : la remise s'ouvre</small></div>
        <input type="text" class="form-control" id="scan" placeholder="N° de LT ou téléphone du destinataire" autocomplete="off" aria-label="N° de LT à remettre">
        <span class="ox-scan-res" id="scan-res" aria-live="polite"></span>
    </div>

    <div class="cx-kpis" id="kpis"></div>

    <div class="cx-card">
        <div class="cx-toolbar">
            <div class="cx-field">
                <label class="cx-label" for="f-age">Ancienneté</label>
                <select class="form-control" id="f-age">
                    <option value="">Toutes</option>
                    <option value="0">Arrivés aujourd'hui</option>
                    <option value="3">Plus de 3 jours</option>
                    <option value="7">Plus de 7 jours</option>
                    <option value="15">Plus de 15 jours (retour)</option>
                </select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-avis">Avis</label>
                <select class="form-control" id="f-avis">
                    <option value="">Tous</option>
                    <option value="0">Sans avis envoyé</option>
                    <option value="1">Avis envoyé</option>
                </select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-prov">Provenance</label>
                <select class="form-control" id="f-prov"></select>
            </div>
            <div class="cx-field cx-grow">
                <label class="cx-label" for="q">Recherche</label>
                <div class="cx-search"><i class="fa fa-search"></i><input type="search" class="form-control" id="q" placeholder="N° LT, nom, téléphone…"></div>
            </div>
        </div>
        <div id="dt-instance"></div>
        <div class="cx-card-body">
            <div class="cx-selbar cx-hidden" id="selbar">
                <b id="sel-n"></b><span class="ox-grow"></span>
                <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" id="btn-avis-lot"><i class="fa fa-whatsapp"></i> Avis WhatsApp</button>
                <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" id="btn-reo-lot"><i class="fa fa-random"></i> Réorienter</button>
            </div>
        </div>
    </div>

    <p class="cx-demo-bar">Maquette - données de démonstration stockées dans le navigateur · les liens WhatsApp / SMS ouvrent l'application avec le message pré-rempli</p>
</main>

<div id="cx-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="../commercial/assets/cx-core.js"></script>
<script src="../commercial/assets/cx-data.js"></script>
<script src="../commercial/assets/cx-tarifs.js"></script>
<script src="../commercial/assets/cx-demo-exploitation.js"></script>
<script src="../guichet/assets/guichet-commun.js"></script>
<script src="assets/ops-commun.js"></script>
<script>window.CX_BASE = "../commercial/";</script>
<script src="../commercial/assets/cx-shell.js"></script>
<script src="assets/pages/instance.js"></script>
</body>
</html>
