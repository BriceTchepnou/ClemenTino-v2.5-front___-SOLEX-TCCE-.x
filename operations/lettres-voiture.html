<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Opérations · Gestion des lettres de voiture - ClemenTino</title>

    <!-- ===== Dépendances (déjà présentes dans le layout Symfony existant) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- ===== Charte commune (module Commercial) + Opérations ===== -->
    <link rel="stylesheet" href="../commercial/assets/cx.css">
    <link rel="stylesheet" href="assets/ops.css">
</head>
<body class="cx-app" data-module="operations" data-page="o-lettres">

<div id="cx-header"></div>
<div id="cx-subnav"></div>

<main class="cx-main">
    <div class="cx-page-head">
        <div>
            <div class="cx-crumb">Opérations · Expéditions &amp; bordereaux</div>
            <h1 class="cx-title">Gestion des lettres de voiture <small id="l-count"></small></h1>
        </div>
        <div class="cx-page-actions">
            <div id="ox-agence-slot"></div>
            <button type="button" class="cx-btn cx-btn-ghost" id="btn-export"><i class="fa fa-download"></i> Exporter (CSV)</button>
        </div>
    </div>

    <div class="cx-card">
        <div class="cx-toolbar">
            <div class="cx-field cx-grow">
                <label class="cx-label" for="q">Recherche multicritère</label>
                <div class="cx-search"><i class="fa fa-search"></i><input type="search" class="form-control" id="q" placeholder="N° RT, n° manuel, téléphone, nom, n° de bordereau…"></div>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-etape">Étape</label>
                <select class="form-control" id="f-etape"></select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-agence">Agence</label>
                <select class="form-control" id="f-agence">
                    <option value="MOI">Mon agence (départ ou arrivée)</option>
                    <option value="DEP">Mon agence au départ</option>
                    <option value="ARR">Mon agence à l'arrivée</option>
                    <option value="ICI">Présentes dans mon agence</option>
                    <option value="">Tout le réseau</option>
                </select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-du">Du</label>
                <input type="date" class="form-control" id="f-du">
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-au">Au</label>
                <input type="date" class="form-control" id="f-au">
            </div>
            <div class="cx-field">
                <span class="cx-label">Filtres</span>
                <label class="cx-help" style="display:block;margin:6px 0 0"><input type="checkbox" id="f-retard"> En retard</label>
                <label class="cx-help" style="display:block;margin:2px 0 0"><input type="checkbox" id="f-incident"> Avec incident</label>
            </div>
            <div class="cx-field">
                <button type="button" class="cx-btn cx-btn-link cx-btn-sm" id="btn-reset"><i class="fa fa-times"></i> Effacer</button>
            </div>
        </div>
        <div id="dt-lt"></div>
        <div class="cx-card-body">
            <div class="cx-selbar cx-hidden" id="selbar">
                <b id="sel-n"></b><span class="ox-grow"></span>
                <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" id="btn-reo"><i class="fa fa-random"></i> Réorienter les LT</button>
                <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" id="btn-sel-vider"><i class="fa fa-times"></i> Désélectionner</button>
            </div>
        </div>
    </div>

    <p class="cx-demo-bar">Maquette - données de démonstration stockées dans le navigateur</p>
</main>

<div id="cx-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="../commercial/assets/cx-core.js"></script>
<script src="../commercial/assets/cx-data.js"></script>
<script src="../commercial/assets/cx-tarifs.js"></script>
<script src="../commercial/assets/cx-demo-exploitation.js"></script>
<script src="../guichet/assets/guichet-commun.js"></script>
<script src="assets/ops-commun.js"></script>
<script>window.CX_BASE = "../commercial/";</script>
<script src="../commercial/assets/cx-shell.js"></script>
<script src="assets/pages/lettres-voiture.js"></script>
</body>
</html>
