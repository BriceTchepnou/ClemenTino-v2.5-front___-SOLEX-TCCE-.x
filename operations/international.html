<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Opérations · International - ClemenTino</title>

    <!-- ===== Dépendances (déjà présentes dans le layout Symfony existant) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- ===== Charte commune (module Commercial) + Opérations ===== -->
    <link rel="stylesheet" href="../commercial/assets/cx.css">
    <link rel="stylesheet" href="assets/ops.css">
</head>
<body class="cx-app" data-module="operations" data-page="o-international">

<div id="cx-header"></div>
<div id="cx-subnav"></div>

<main class="cx-main">
    <div class="cx-page-head">
        <div>
            <div class="cx-crumb">Opérations · International</div>
            <h1 class="cx-title" id="l-titre">Expéditions internationales</h1>
        </div>
        <div class="cx-page-actions">
            <div id="ox-agence-slot"></div>
        </div>
    </div>

    <div class="cx-kpis" id="kpis"></div>

    <div class="cx-card">
        <div class="cx-toolbar">
            <div class="cx-field">
                <label class="cx-label" for="f-partenaire">Partenaire</label>
                <select class="form-control" id="f-partenaire"></select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-du">Du</label>
                <input type="date" class="form-control" id="f-du">
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-au">Au</label>
                <input type="date" class="form-control" id="f-au">
            </div>
            <div class="cx-field cx-grow">
                <label class="cx-label" for="q">Recherche</label>
                <div class="cx-search"><i class="fa fa-search"></i><input type="search" class="form-control" id="q" placeholder="N° RT, AWB, pays, nom…"></div>
            </div>
        </div>
        <div class="cx-tabs" id="onglets" role="tablist">
            <a data-tab="expeditions" class="active" role="tab"><i class="fa fa-globe"></i> Expéditions internationales <span class="cx-count" id="n-expeditions">0</span></a>
            <a data-tab="groupage" role="tab"><i class="fa fa-arrow-up"></i> Groupage international <span class="cx-count" id="n-groupage">0</span></a>
            <a data-tab="degroupage" role="tab"><i class="fa fa-arrow-down"></i> Dégroupage international <span class="cx-count" id="n-degroupage">0</span></a>
        </div>
        <div class="cx-card-body" style="padding-bottom:0"><div class="cx-note cx-note-info" id="aide" style="margin-top:0"></div></div>
        <div id="dt-inter"></div>
        <div class="cx-card-body">
            <div class="cx-selbar cx-hidden" id="selbar">
                <b id="sel-n"></b><span class="ox-grow"></span>
                <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" data-act="partenaire" data-tabs="groupage"><i class="fa fa-plane"></i> Transmettre au partenaire</button>
                <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" data-act="recevoir" data-tabs="degroupage"><i class="fa fa-sign-in"></i> Réceptionner</button>
                <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" data-act="agence" data-tabs="degroupage"><i class="fa fa-inbox"></i> Mettre en agence</button>
                <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" data-act="coursier" data-tabs="degroupage"><i class="fa fa-motorcycle"></i> Mettre en livraison (coursier)</button>
                <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" data-act="livree" data-tabs="expeditions"><i class="fa fa-check"></i> Livraison confirmée par le partenaire</button>
            </div>
        </div>
    </div>

    <p class="cx-demo-bar">Maquette - données de démonstration stockées dans le navigateur (quelques expéditions internationales ajoutées une fois)</p>
</main>

<div id="cx-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="../commercial/assets/cx-core.js"></script>
<script src="../commercial/assets/cx-data.js"></script>
<script src="../commercial/assets/cx-tarifs.js"></script>
<script src="../commercial/assets/cx-demo-exploitation.js"></script>
<script src="../guichet/assets/guichet-commun.js"></script>
<script src="assets/ops-commun.js"></script>
<script>window.CX_BASE = "../commercial/";</script>
<script src="../commercial/assets/cx-shell.js"></script>
<script src="assets/ops-listes.js"></script>
<script src="assets/pages/international.js"></script>
</body>
</html>
