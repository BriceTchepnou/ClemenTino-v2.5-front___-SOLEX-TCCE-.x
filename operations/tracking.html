<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Tracking · Suivi d'un colis - ClemenTino</title>

    <!-- ===== Dépendances (déjà présentes dans le layout Symfony existant) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- ===== Charte commune (module Commercial) + Opérations ===== -->
    <link rel="stylesheet" href="../commercial/assets/cx.css">
    <link rel="stylesheet" href="assets/ops.css">
</head>
<body class="cx-app" data-module="tracking" data-page="o-tracking">

<div id="cx-header"></div>
<div id="cx-subnav"></div>

<main class="cx-main" style="max-width:1100px">
    <section class="ox-track-hero">
        <h1><i class="fa fa-crosshairs"></i> Suivre un colis</h1>
        <p>Saisissez le numéro de lettre de transport (LT), le numéro de LT manuelle ou le téléphone du destinataire.</p>
        <form class="ox-track-form" id="form-track" autocomplete="off">
            <label for="track-q" class="sr-only">N° de LT, n° manuel ou téléphone</label>
            <input type="search" class="form-control" id="track-q" placeholder="RT-2611-00001 · 1042 · 699 12 34 56">
            <button type="submit" class="cx-btn cx-btn-new" id="btn-track"><i class="fa fa-search"></i> Suivre</button>
        </form>
        <div class="ox-track-mode">
            <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm active" data-vue="interne"><i class="fa fa-lock"></i> Vue agent</button>
            <button type="button" class="cx-btn cx-btn-ghost cx-btn-sm" data-vue="client"><i class="fa fa-eye"></i> Vue client</button>
        </div>
    </section>

    <div class="cx-note cx-note-info ox-public-banner"><i class="fa fa-eye"></i><div><b>Vue client</b> : aperçu de ce que voit le client avec le lien de suivi (sans montants, agents, pièces d'identité ni coordonnées complètes).</div></div>

    <div id="resultats"></div>
    <div id="suivi"></div>
</main>

<div id="cx-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="../commercial/assets/cx-core.js"></script>
<script src="../commercial/assets/cx-data.js"></script>
<script src="../commercial/assets/cx-tarifs.js"></script>
<script src="../commercial/assets/cx-demo-exploitation.js"></script>
<script src="../guichet/assets/guichet-commun.js"></script>
<script src="assets/ops-commun.js"></script>
<script>window.CX_BASE = "../commercial/";</script>
<script src="../commercial/assets/cx-shell.js"></script>
<script src="assets/pages/tracking.js"></script>
</body>
</html>
