<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Opérations · Bordereaux d'expédition - ClemenTino</title>

    <!-- ===== Dépendances (déjà présentes dans le layout Symfony existant) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- ===== Charte commune (module Commercial) + Opérations ===== -->
    <link rel="stylesheet" href="../commercial/assets/cx.css">
    <link rel="stylesheet" href="assets/ops.css">
</head>
<body class="cx-app" data-module="operations" data-page="o-bordereaux">

<div id="cx-header"></div>
<div id="cx-subnav"></div>

<main class="cx-main">
    <div class="cx-page-head">
        <div>
            <div class="cx-crumb">Opérations · Expéditions &amp; bordereaux</div>
            <h1 class="cx-title">Bordereaux d'expédition <small id="l-count"></small></h1>
        </div>
        <div class="cx-page-actions">
            <div id="ox-agence-slot"></div>
            <a class="cx-btn cx-btn-ghost" href="bordereaux-provisoires.html"><i class="fa fa-magic"></i> Bordereaux provisoires</a>
            <button type="button" class="cx-btn cx-btn-new" id="btn-ajouter"><i class="fa fa-plus"></i> Ajouter bordereau</button>
        </div>
    </div>

    <div class="cx-kpis" id="kpis"></div>

    <div class="cx-card">
        <div class="cx-toolbar">
            <div class="cx-field">
                <label class="cx-label" for="f-ville">Ville</label>
                <select class="form-control" id="f-ville"></select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-bureau">Bureau</label>
                <select class="form-control" id="f-bureau"></select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-du">Du</label>
                <input type="date" class="form-control" id="f-du">
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-au">Au</label>
                <input type="date" class="form-control" id="f-au">
            </div>
            <div class="cx-field cx-grow">
                <label class="cx-label" for="q">Recherche</label>
                <div class="cx-search"><i class="fa fa-search"></i><input type="search" class="form-control" id="q" placeholder="N° BE, n° manuel, immatriculation, chauffeur, transporteur…"></div>
            </div>
        </div>
        <div class="cx-tabs" id="onglets" role="tablist">
            <a data-tab="envoyes" class="active" role="tab"><i class="fa fa-arrow-up"></i> Bordereaux envoyés <span class="cx-count" id="n-envoyes">0</span></a>
            <a data-tab="entrants" role="tab"><i class="fa fa-arrow-down"></i> Bordereaux entrants <span class="cx-count" id="n-entrants">0</span></a>
        </div>
        <div class="cx-vue-bar"><span class="cx-vue-titre">Affichage du bordereau : tableau, Kanban par statut, calendrier des départs ou frise départ → arrivée</span><div id="vue-slot"></div></div>
        <div id="dt-bordereaux"></div>
    </div>

    <p class="cx-demo-bar">Maquette - données de démonstration stockées dans le navigateur</p>
</main>

<div id="cx-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="../commercial/assets/cx-core.js"></script>
<script src="../commercial/assets/cx-data.js"></script>
<script src="../commercial/assets/cx-vues.js"></script>
<script src="../commercial/assets/cx-tarifs.js"></script>
<script src="../commercial/assets/cx-demo-exploitation.js"></script>
<script src="../guichet/assets/guichet-commun.js"></script>
<script src="assets/ops-commun.js"></script>
<script>window.CX_BASE = "../commercial/";</script>
<script src="../commercial/assets/cx-shell.js"></script>
<script src="assets/ops-listes.js"></script>
<script src="assets/pages/bordereaux.js"></script>
</body>
</html>
