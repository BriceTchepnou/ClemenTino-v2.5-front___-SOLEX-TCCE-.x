<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commercial · Suivi des factures - ClemenTino</title>

    <!-- ===== Dépendances (déjà présentes dans le layout Symfony existant) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- ===== Charte du module Commercial ===== -->
    <link rel="stylesheet" href="assets/cx.css">
    <link rel="stylesheet" href="assets/pages/factures-suivi.css">
</head>
<body class="cx-app" data-page="factures-suivi">

<div id="cx-header"></div>
<div id="cx-subnav"></div>

<main class="cx-main">

    <div class="cx-page-head">
        <div>
            <div class="cx-crumb"><a href="index.html">Commercial</a> › Facturation</div>
            <h1 class="cx-title">Suivi des factures <small id="h-periode"></small></h1>
        </div>
        <div class="cx-page-actions">
            <a class="cx-btn cx-btn-ghost" href="journal-vente.html"><i class="fa fa-book"></i> Journal de vente</a>
            <a class="cx-btn cx-btn-new" href="facture-emettre.html"><i class="fa fa-plus"></i> Émettre une facture</a>
        </div>
    </div>

    <!-- Indicateurs (calculés sur le client et la période filtrés) -->
    <div class="cx-kpis" id="kpis"></div>

    <div class="cx-card">
        <!-- Onglets par statut -->
        <div class="cx-tabs" id="tabs">
            <a data-tab="TOUTES" class="active">Toutes <span class="cx-count" data-count="TOUTES">0</span></a>
            <a data-tab="BROUILLON">Brouillons <span class="cx-count" data-count="BROUILLON">0</span></a>
            <a data-tab="EMISE">Émises <span class="cx-count" data-count="EMISE">0</span></a>
            <a data-tab="ENVOYEE">Envoyées <span class="cx-count" data-count="ENVOYEE">0</span></a>
            <a data-tab="PARTIELLE">Partiellement payées <span class="cx-count" data-count="PARTIELLE">0</span></a>
            <a data-tab="PAYEE">Payées <span class="cx-count" data-count="PAYEE">0</span></a>
            <a data-tab="RETARD"><i class="fa fa-exclamation-circle" style="color:var(--cx-red)"></i> En retard <span class="cx-count" data-count="RETARD">0</span></a>
            <a data-tab="ANNULEE">Annulées <span class="cx-count" data-count="ANNULEE">0</span></a>
        </div>

        <!-- Filtres -->
        <div class="cx-toolbar">
            <div class="cx-field cx-grow cx-search">
                <label class="cx-label" for="q">Recherche</label>
                <i class="fa fa-search" style="top:auto;bottom:11px;transform:none"></i>
                <input type="text" id="q" class="form-control" placeholder="N° de facture, client, montant…">
            </div>
            <div class="cx-field fs-client">
                <label class="cx-label" for="f-client">Client</label>
                <select id="f-client" class="form-control" style="width:100%"><option value="">Tous les clients</option></select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-du">Émises du</label>
                <input type="date" id="f-du" class="form-control">
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-au">au</label>
                <input type="date" id="f-au" class="form-control">
            </div>
            <div class="cx-field">
                <button type="button" class="cx-btn cx-btn-ghost" id="btn-reinit" style="height:36px"><i class="fa fa-undo"></i> Réinitialiser</button>
            </div>
        </div>

        <div id="dt"></div>
    </div>

    <p class="cx-demo-bar">Maquette - données de démonstration stockées dans le navigateur.</p>
</main>

<!-- =============================================================
     Modale : relance client
     ============================================================= -->
<div class="modal fade" id="m-relance" tabindex="-1" role="dialog">
    <div class="modal-dialog" style="max-width:640px"><div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h4 class="modal-title"><i class="fa fa-bell-o"></i>Relancer le client</h4>
        </div>
        <div class="modal-body">
            <div class="cx-note cx-note-warn" id="r-resume" style="margin-top:0"></div>
            <div class="cx-field">
                <label class="cx-label req" for="r-to">Destinataire</label>
                <input type="email" id="r-to" class="form-control" placeholder="adresse e-mail de facturation du client">
            </div>
            <div class="cx-field">
                <label class="cx-label" for="r-objet">Objet</label>
                <input type="text" id="r-objet" class="form-control">
            </div>
            <div class="cx-field">
                <label class="cx-label" for="r-texte">Message <span class="cx-opt">(modifiable)</span></label>
                <textarea id="r-texte" class="form-control" rows="12"></textarea>
            </div>
            <div class="cx-field" style="margin-bottom:0">
                <div class="cx-label">Relances précédentes</div>
                <div id="r-historique" class="cx-cell-sub"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="cx-btn cx-btn-ghost" data-dismiss="modal">Annuler</button>
            <button type="button" class="cx-btn cx-btn-primary" id="r-ok"><i class="fa fa-envelope-o"></i> Ouvrir la messagerie et tracer la relance</button>
        </div>
    </div></div>
</div>

<div id="cx-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="assets/cx-core.js"></script>
<script src="assets/cx-data.js"></script>
<script src="assets/cx-shell.js"></script>
<script src="assets/pages/facturation.js"></script>
<script src="assets/pages/factures-suivi.js"></script>
</body>
</html>
