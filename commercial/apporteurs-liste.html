<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commercial · Apporteurs d'affaires - ClemenTino</title>

    <!-- ===== Dépendances (déjà présentes dans le layout Symfony existant) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- ===== Charte du module Commercial ===== -->
    <link rel="stylesheet" href="assets/cx.css">
    <link rel="stylesheet" href="assets/pages/apporteurs.css">
</head>
<body class="cx-app" data-page="apporteurs-liste">

<div id="cx-header"></div>
<div id="cx-subnav"></div>

<main class="cx-main">

    <div class="cx-page-head">
        <div>
            <div class="cx-crumb"><a href="index.html">Commercial</a> › Apporteurs d'affaires</div>
            <h1 class="cx-title">Apporteurs d'affaires <small id="h-sous-titre"></small></h1>
        </div>
        <div class="cx-page-actions">
            <a class="cx-btn cx-btn-ghost" href="commissions.html"><i class="fa fa-percent"></i> Commissions</a>
            <a class="cx-btn cx-btn-new" href="apporteur-form.html"><i class="fa fa-plus"></i> Nouvel apporteur</a>
        </div>
    </div>

    <div class="cx-kpis" id="kpis"></div>

    <div class="cx-card">
        <div class="cx-toolbar">
            <div class="cx-field cx-grow cx-search">
                <label class="cx-label" for="q">Recherche</label>
                <i class="fa fa-search" style="top:auto;bottom:11px;transform:none"></i>
                <input type="text" id="q" class="form-control" placeholder="Code, nom, prénoms, téléphone, email, matricule…">
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-ville">Ville</label>
                <select id="f-ville" class="form-control"><option value="">Toutes les villes</option></select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-agence">Agence</label>
                <select id="f-agence" class="form-control"><option value="">Toutes les agences</option></select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-type">Type</label>
                <select id="f-type" class="form-control"><option value="">Tous les types</option></select>
            </div>
            <div class="cx-field">
                <label class="cx-label" for="f-statut">Statut</label>
                <select id="f-statut" class="form-control">
                    <option value="">Tous</option>
                    <option value="ACTIF">Activés</option>
                    <option value="SUSPENDU">Suspendus</option>
                </select>
            </div>
            <div class="cx-field">
                <button type="button" class="cx-btn cx-btn-ghost" id="btn-reinit" style="height:36px"><i class="fa fa-undo"></i> Réinitialiser</button>
            </div>
        </div>
        <div id="dt"></div>
    </div>

    <p class="cx-demo-bar">Maquette - données de démonstration stockées dans le navigateur.</p>
</main>

<!-- Modale : clients apportés -->
<div class="modal fade" id="m-clients" tabindex="-1" role="dialog">
    <div class="modal-dialog" style="max-width:720px"><div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h4 class="modal-title"><i class="fa fa-building-o"></i><span id="mc-titre">Clients apportés</span></h4>
        </div>
        <div class="modal-body" style="padding:0"><div id="mc-liste"></div></div>
        <div class="modal-footer">
            <a class="cx-btn cx-btn-ghost" id="mc-commissions" href="commissions.html"><i class="fa fa-percent"></i> Ses commissions</a>
            <button type="button" class="cx-btn cx-btn-primary" data-dismiss="modal">Fermer</button>
        </div>
    </div></div>
</div>

<div id="cx-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="assets/cx-core.js"></script>
<script src="assets/cx-data.js"></script>
<script src="assets/cx-shell.js"></script>
<script src="assets/pages/facturation.js"></script>
<script src="assets/pages/apporteurs.js"></script>
<script src="assets/pages/apporteurs-liste.js"></script>
</body>
</html>
