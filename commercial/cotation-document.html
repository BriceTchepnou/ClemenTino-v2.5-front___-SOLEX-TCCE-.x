<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commercial · Devis - ClemenTino</title>

    <!-- ===== Dépendances (déjà présentes dans le layout Symfony existant) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <!-- ===== Charte du module Commercial ===== -->
    <link rel="stylesheet" href="assets/cx.css">
    <link rel="stylesheet" href="assets/pages/cotation-document.css">
</head>
<body class="cx-app" data-page="cotation-document">

<div id="cx-header"></div>
<div id="cx-subnav"></div>

<main class="cx-main">

    <!-- Barre d'outils (non imprimée) -->
    <div class="cx-page-head cx-no-print">
        <div>
            <div class="cx-crumb"><a href="index.html">Commercial</a> / <a href="cotations-liste.html">Cotations</a> / <span id="dCrumb">Devis</span></div>
            <h1 class="cx-title">Devis <span id="dNumero" class="cx-mono"></span> <small id="dStatut"></small></h1>
        </div>
        <div class="cx-page-actions">
            <a class="cx-btn cx-btn-ghost" href="cotations-liste.html" id="btnRetour"><i class="fa fa-arrow-left"></i> Retour</a>
            <a class="cx-btn cx-btn-ghost cx-hidden" id="btnModifier"><i class="fa fa-pencil"></i> Modifier</a>
            <button type="button" class="cx-btn cx-btn-ghost" id="btnPdf"><i class="fa fa-file-pdf-o"></i> Télécharger en PDF</button>
            <button type="button" class="cx-btn cx-btn-primary" id="btnImprimer"><i class="fa fa-print"></i> Imprimer</button>
        </div>
    </div>
    <div class="cx-note cx-note-info cx-no-print cd-astuce"><i class="fa fa-info-circle"></i>
        <div>Pour le PDF, choisissez « Enregistrer au format PDF » comme imprimante, format A4, marges par défaut.</div></div>

    <!-- Feuille A4 (contenu généré par cotation-document.js) -->
    <div class="cd-sheet" id="doc">
        <div class="cx-empty"><i class="fa fa-spinner fa-spin"></i><b>Chargement du devis…</b></div>
    </div>
</main>

<div id="cx-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="assets/cx-core.js"></script>
<script src="assets/cx-data.js"></script>
<script src="assets/cx-shell.js"></script>
<script src="assets/cx-pdf.js"></script>
<script src="assets/pages/cotations-commun.js"></script>
<script src="assets/pages/cotation-document.js"></script>
</body>
</html>
