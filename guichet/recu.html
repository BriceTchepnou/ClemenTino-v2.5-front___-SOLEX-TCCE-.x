<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reçu de transport - Guichet ClemenTino</title>

    <!-- ===== Dépendances (déjà présentes dans le layout Symfony existant) ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <!-- ===== Charte commune (module Commercial) + Guichet ===== -->
    <link rel="stylesheet" href="../commercial/assets/cx.css">
    <link rel="stylesheet" href="assets/guichet.css">
    <link rel="stylesheet" href="assets/recu.css">
</head>
<body class="cx-app" data-module="guichet" data-page="g-recu">

<div id="cx-header"></div>
<div id="cx-subnav"></div>

<main class="cx-main gx-recu-main">

    <!-- ===== Barre d'outils (non imprimée) ===== -->
    <div class="cx-page-head cx-no-print">
        <div>
            <div class="cx-crumb">Guichet · <a href="expeditions-liste.html">Historique des saisies</a> / Reçu</div>
            <h1 class="cx-title">Reçu <span class="cx-mono" id="h-numero"></span> <small id="h-statut"></small></h1>
        </div>
        <div class="cx-page-actions" id="gx-outils">
            <a class="cx-btn cx-btn-ghost" href="expeditions-liste.html"><i class="fa fa-arrow-left"></i> Historique</a>
            <a class="cx-btn cx-btn-ghost cx-hidden" id="btn-corriger" href="#"><i class="fa fa-pencil"></i> Corriger</a>
            <a class="cx-btn gx-btn-wa" id="btn-wa" href="#" target="_blank" rel="noopener"><i class="fa fa-whatsapp"></i> Renvoyer par WhatsApp</a>
            <button type="button" class="cx-btn cx-btn-ghost" id="btn-pdf"><i class="fa fa-file-pdf-o"></i> Télécharger en PDF</button>
            <button type="button" class="cx-btn cx-btn-primary" id="btn-imprimer"><i class="fa fa-print"></i> Imprimer</button>
        </div>
    </div>
    <div class="cx-no-print" id="gx-alertes"></div>

    <!-- ===== Feuille A4 (rendue par CX.recu.html) ===== -->
    <div class="gx-recu-page" id="gx-recu"></div>

    <!-- Historique (non imprimé) -->
    <div class="cx-card cx-no-print cx-hidden" id="gx-histo-card" style="margin-top:18px">
        <div class="cx-card-head"><div><h3 class="cx-card-title">Historique de l'expédition</h3></div></div>
        <div class="cx-card-body"><ul class="cx-timeline" id="gx-historique"></ul></div>
    </div>
</main>

<div id="cx-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
<script src="../commercial/assets/cx-core.js"></script>
<script src="../commercial/assets/cx-data.js"></script>
<script src="../commercial/assets/cx-tarifs.js"></script>
<script src="../commercial/assets/cx-demo-exploitation.js"></script>
<script src="../commercial/assets/cx-pdf.js"></script>
<script>window.CX_BASE = "../commercial/";</script>
<script src="../commercial/assets/cx-shell.js"></script>
<script src="assets/guichet-commun.js"></script>
<script src="assets/recu.js"></script>
<script src="assets/recu-page.js"></script>
</body>
</html>
